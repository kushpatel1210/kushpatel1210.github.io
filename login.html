<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Umiya Physiotherapy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: "Open Sans", sans-serif;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        min-height: 100vh;
      }
      .login-card {
        background: white;
        padding: 2.5rem;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        margin: auto;
      }
      h2 {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        color: #222;
      }
      .btn-primary {
        border-radius: 50px;
        padding: 10px 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-card text-center">
      <img
        src="Umiya_Logo.png"
        alt="Logo"
        style="width: 70px"
        onerror="this.src = 'https://placehold.co/70x70/0d6efd/FFF?text=Logo'"
      />
      <h2 class="mt-3 mb-4">Admin Login</h2>
      <button
        type="button"
        class="btn btn-outline-dark w-100 mb-3 fw-bold"
        id="googleLoginBtn"
        style="border-radius: 50px; padding: 12px"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-google me-2"
          viewBox="0 0 16 16"
          style="margin-top: -3px"
        >
          <path
            d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z"
          />
        </svg>
        Sign in with Google
      </button>

      <div class="d-flex align-items-center mb-3">
        <hr class="flex-grow-1" />
        <span class="mx-2 text-muted small">OR</span>
        <hr class="flex-grow-1" />
      </div>
      <form id="loginForm">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="doctor@example.com"
            required
          />
        </div>
        <div class="mb-4 text-start">
          <label class="form-label fw-bold">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
          />
        </div>

        <div id="errorMessage" class="error-msg mb-3"></div>

        <div class="d-flex justify-content-between align-items-center mt-4">
          <button
            type="button"
            class="btn btn-outline-dark"
            onclick="window.location.href = 'index.html'"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="loginBtn">
            Login to Dashboard
          </button>
        </div>
      </form>
    </div>

    <script>
      // Use your project credentials
      const SUPABASE_URL = "https://oyxafvmriefntarqzvni.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_nJ1YNu-z5Z-ItPmgOA6R5g_dExnChzD";
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const btn = document.getElementById("loginBtn");

          btn.disabled = true;
          btn.innerText = "Authenticating...";

          const { data, error } = await _supabase.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            alert("Login failed: " + error.message);
            btn.disabled = false;
            btn.innerText = "Login to Dashboard";
          } else {
            // Redirect to your admin dashboard file
            window.location.href = "admin_dashboard.html";
          }
        });
      // Google Login Action
      document
        .getElementById("googleLoginBtn")
        .addEventListener("click", async () => {
          const btn = document.getElementById("googleLoginBtn");
          btn.disabled = true;
          btn.innerHTML = "Redirecting...";

          const { data, error } = await _supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo:
                "https://kushpatel2601.github.io/admin_dashboard.html",
            },
          });

          if (error) {
            alert("Google Login Error: " + error.message);
            btn.disabled = false;
            btn.innerHTML = `Sign in with Google`;
          }
        });
    </script>
  </body>
</html>
